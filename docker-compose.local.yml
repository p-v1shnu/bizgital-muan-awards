# Local development: database and object storage only. The backend and
# frontend run on the host with `npm run start:dev` / `npm run dev` so that
# hot reload works.
#
#   docker compose -f docker-compose.local.yml up -d
#   cd backend && npx prisma migrate dev && npm run seed && npm run start:dev
#   cd frontend && npm run dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Docker keeps container logs forever by default, which on a small server
    # is a disk that fills quietly months after launch (12-factor XI: the app
    # writes to stdout and the platform decides what happens next).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-muan_awards}
      MYSQL_USER: ${MYSQL_USER:-muan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-muan}
      TZ: Asia/Vientiane
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data_local:/var/lib/mysql

  # S3-compatible storage, standing in for DigitalOcean Spaces.
  # Console at http://localhost:9001
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # Docker keeps container logs forever by default, which on a small server
    # is a disk that fills quietly months after launch (12-factor XI: the app
    # writes to stdout and the platform decides what happens next).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data_local:/data

  # Creates the bucket once and exits.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    # The real bucket policy (docs/storage-policy.json), not `mc anonymous set
    # download` — that canned setting grants both GetObject and ListBucket to
    # everyone, so a fresh dev environment let anyone browse every file in the
    # bucket, nominees and winners included, before the site ever announced
    # them. Measured: `mc anonymous set download` answers 200 on `?list-type=2`;
    # this policy answers 403 on the same request and still 200 on a real key.
    # (MinIO can run this file as-is because it implements bucket policy JSON in
    # full — DigitalOcean Spaces cannot, which is why production instead grants
    # `public-read` per object; see storage.service.ts.)
    volumes:
      - ./docs/storage-policy.json:/policy.json:ro
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do sleep 2; done &&
        mc mb --ignore-existing local/${S3_BUCKET:-muan-awards} &&
        mc anonymous set-json /policy.json local/${S3_BUCKET:-muan-awards}
      "

volumes:
  mysql_data_local:
  minio_data_local:
