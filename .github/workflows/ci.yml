name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older answer is not
# worth waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muan_awards_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # The suite wipes this schema between runs, so it must be a throwaway.
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/muan_awards_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/muan_awards_test
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-0123456789
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-long-enough-0123456789
      IP_HASH_SALT: ci-ip-hash-salt-that-is-long-enough-0123456789
      SETUP_ENABLED: 'true'
      CORS_ORIGINS: http://localhost:3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      # The lint scripts named a linter neither project had installed, so this
      # step is what keeps that from happening again: a config nobody runs is
      # how the last one rotted.
      - run: npm run lint
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test

      # A vulnerable dependency should fail the build, not sit in a report
      # nobody opens. The registry's own audit endpoint (not our lockfile —
      # confirmed by re-running against the same commit) has intermittently
      # answered with a 500/503/400 of its own while it winds down in favor
      # of a bulk replacement; a few retries tell that apart from a real
      # advisory without giving up the gate entirely.
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit failed (attempt $attempt/3) — registry flakes clear on retry; a real advisory won't."
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

  frontend:
    name: Frontend — build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      # Same registry-side flake as the backend job's audit step — see the
      # comment there.
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit failed (attempt $attempt/3) — registry flakes clear on retry; a real advisory won't."
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

  # Every other job runs the apps straight from `npm`, so until now the
  # Dockerfiles and docker-compose.yml were first exercised on the production
  # server — which is where the missing `.next/cache` permissions and the
  # container binding to its own hostname were both found. This builds the
  # images production builds, starts them the way production starts them
  # (migrations included), and probes them from outside the containers.
  docker:
    name: Docker — build and boot the production images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Throwaway values in the shape .env.example asks for. Storage points at
      # a host that does not exist: nothing here uploads, and the liveness
      # probes below do not touch it.
      - name: Write a CI .env
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-root
          MYSQL_DATABASE=muan_awards
          MYSQL_USER=muan
          MYSQL_PASSWORD=ci-muan
          DATABASE_URL=mysql://muan:ci-muan@mysql:3306/muan_awards
          JWT_SECRET=ci-jwt-secret-that-is-long-enough-0123456789
          REFRESH_TOKEN_SECRET=ci-refresh-secret-that-is-long-enough-0123456789
          IP_HASH_SALT=ci-ip-hash-salt-that-is-long-enough-0123456789
          INTERNAL_API_SECRET=ci-internal-api-secret-that-is-long-enough-0123
          REVALIDATE_SECRET=ci-revalidate-secret
          SETUP_ENABLED=false
          CORS_ORIGINS=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          NEXT_PUBLIC_IMAGE_BASE_URL=http://localhost:9000/muan-awards
          S3_ENDPOINT=http://storage.invalid:9000
          S3_REGION=us-east-1
          S3_BUCKET=muan-awards
          S3_ACCESS_KEY=ci-access-key
          S3_SECRET_KEY=ci-secret-key
          S3_PUBLIC_URL=http://localhost:9000/muan-awards
          EOF

      - name: Build the images
        run: docker compose build

      # --wait holds until every container with a healthcheck reports healthy,
      # so a backend that cannot migrate or refuses its environment fails here.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 240

      # The containers' own healthchecks call 127.0.0.1 from inside; this is
      # the view Caddy has, through the published loopback ports.
      - name: Probe from outside the containers
        run: |
          curl -fsS http://127.0.0.1:3001/api/v1/health
          curl -fsS http://127.0.0.1:3001/api/v1/health/errors
          curl -fsS http://127.0.0.1:3000/api/health

      - name: Show what the containers said
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color

  e2e:
    name: End to end — the browser pass
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muan_awards
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/muan_awards
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-0123456789
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-long-enough-0123456789
      IP_HASH_SALT: ci-ip-hash-salt-that-is-long-enough-0123456789
      SETUP_ENABLED: 'true'
      CORS_ORIGINS: http://localhost:3000
      BACKEND_PORT: '3001'
      # The site and the API must share a hostname or the refresh cookie is
      # cross-site and SameSite=Lax drops it — the admin would be signed out on
      # every reload. Production serves both from one domain through Caddy.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      E2E_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # The site is built before the seed runs, so its public pages are
      # prerendered from an empty database. This lets the seed purge them;
      # without it the browser pass reads a snapshot of nothing.
      REVALIDATE_SECRET: ci-revalidate-secret
      # Exercises the path production takes: the site's server identifying
      # itself to the rate limiter rather than being counted as one visitor.
      INTERNAL_API_SECRET: ci-internal-api-secret-that-is-long-enough-0123
      # And this is what lets the API do the purging by itself, the way it does
      # in production. A test that opens or closes entries and then reads the
      # page needs the change to have reached the cache.
      REVALIDATE_URL: http://127.0.0.1:3000/api/revalidate
      # MinIO stands in for DigitalOcean Spaces here exactly as it does in
      # docker-compose.local.yml — same variable names, same bucket.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: muan-awards
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_URL: http://127.0.0.1:9000/muan-awards

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Without this the API's own S3 client has nothing to talk to: every
      # upload it makes fails, which is exactly what the admin upload test
      # exercises. `--network host` is what lets 127.0.0.1:9000 (the endpoint
      # above) reach the container from both the runner and the API process.
      #
      # Silo (pgsty), the community fork of MinIO — see docker-compose.local.yml
      # for why: MinIO's own images are gone from Docker Hub and no longer
      # pullable anonymously from quay.io. Same API and `mc`. Pinned.
      - name: Start object storage (MinIO)
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:9000/minio/health/live; do sleep 1; done'
          docker run --rm --network host \
            -v "${{ github.workspace }}/docs/storage-policy.json:/policy.json:ro" \
            --entrypoint sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c "
              mc alias set local http://127.0.0.1:9000 $S3_ACCESS_KEY $S3_SECRET_KEY &&
              mc mb --ignore-existing local/$S3_BUCKET &&
              mc anonymous set-json /policy.json local/$S3_BUCKET
            "

      - name: Build and start the API
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          node dist/main.js &
          npx wait-on http://127.0.0.1:3001/api/v1/health --timeout 60000

      - name: Build and start the site
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run the browser pass
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
