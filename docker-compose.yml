# Production stack. Caddy is already installed on the server and proxies to the
# published ports below, so nothing here binds to 0.0.0.0 except through it.
#
# No Redis and no worker container: the MVP has no background jobs (PRD §9).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Docker keeps container logs forever by default, which on a small server
    # is a disk that fills quietly months after launch (12-factor XI: the app
    # writes to stdout and the platform decides what happens next).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Vientiane
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [muan]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Docker keeps container logs forever by default, which on a small server
    # is a disk that fills quietly months after launch (12-factor XI: the app
    # writes to stdout and the platform decides what happens next).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Vientiane
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      SETUP_ENABLED: ${SETUP_ENABLED}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BACKEND_PORT: 3001
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # Lets the API clear the site's cached pages the moment something is
      # saved, instead of the visitor waiting for the next revalidation.
      REVALIDATE_URL: ${REVALIDATE_URL:-http://frontend:3000/api/revalidate}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - '127.0.0.1:3001:3001'
    # A crashed process is restarted by `restart: unless-stopped`; a process
    # that is still running but no longer answering is not, because it never
    # exits. This makes that state visible in `docker compose ps` instead of
    # leaving someone to guess which of the three containers is the sick one.
    # It does not restart anything by itself — Compose has no such setting.
    # `node -e` rather than curl: neither image ships curl, and Node 22 has
    # fetch built in.
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run before the server binds, so the first check has to wait.
      start_period: 90s
    networks: [muan]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        # Empty outside production, so a staging build cannot report into the
        # real property.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        # Where pictures are served from. Baked in at build time, because it
        # also decides which remote host next/image is allowed to fetch.
        NEXT_PUBLIC_IMAGE_BASE_URL: ${NEXT_PUBLIC_IMAGE_BASE_URL}
    restart: unless-stopped
    # Docker keeps container logs forever by default, which on a small server
    # is a disk that fills quietly months after launch (12-factor XI: the app
    # writes to stdout and the platform decides what happens next).
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on: [backend]
    environment:
      NODE_ENV: production
      TZ: Asia/Vientiane
      # Must match the API's, or the refresh endpoint rejects its calls.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [muan]

volumes:
  mysql_data:

networks:
  muan:
